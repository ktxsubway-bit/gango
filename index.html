<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광고 모음</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      background: #f9f9f9; 
    }
    
    .gallery { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 15px; 
      align-items: flex-start; 
    }
    
    .gallery img { 
      width: auto; 
      height: auto; 
      max-width: none; 
      max-height: none; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }
  </style>
</head>
<body>

  <h2>광고 모음</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const gallery = document.getElementById('gallery');
    let index = 1;

    function loadNextImage() {
      const imgPath = `./img/${index}.png`;
      const img = new Image();

      img.onload = function() {
        gallery.appendChild(img);
        index++;
        loadNextImage();
      };

      img.onerror = function() {
        console.log(`총 ${index - 1}개의 이미지를 로드했습니다.`);
      };

      img.src = imgPath;
    }

    loadNextImage();
  </script>

</body>
</html>
