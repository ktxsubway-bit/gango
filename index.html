<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PNG Gallery</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h2>/img 폴더 PNG 목록</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const gallery = document.getElementById('gallery');
    let index = 1;

    function loadNextImage() {
      const imgPath = `./img/${index}.png`; // 파일명 규칙 (예: 1.png, 2.png, ...)
      const img = new Image();

      img.onload = function() {
        gallery.appendChild(img);
        index++;
        loadNextImage(); // 다음 번호 이미지 탐색
      };

      img.onerror = function() {
        // 이미지가 더 이상 존재하지 않으면 멈춤
        console.log(`총 ${index - 1}개의 이미지를 로드했습니다.`);
      };

      img.src = imgPath;
    }

    loadNextImage();
  </script>

</body>
</html>
