<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광고 모음</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      background: #f9f9f9; 
      margin: 0;
    }
    
    /* 갤러리 레이아웃 (반응형 격자) */
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 20px; 
      align-items: center; 
    }
    
    /* 모니터/화면에 맞춰 크기가 자동으로 조절되는 이미지 설정 */
    .gallery img { 
      width: 100%; 
      max-width: 100%; 
      height: auto; 
      object-fit: contain; /* 잘림 방지 */
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      background-color: #fff;
      display: block;
    }
  </style>
</head>
<body>

  <h2>광고 모음</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const gallery = document.getElementById('gallery');
    let index = 1;

    function loadNextImage() {
      const imgPath = `./img/${index}.png`;
      const img = new Image();

      img.onload = function() {
        gallery.appendChild(img);
        index++;
        loadNextImage();
      };

      img.onerror = function() {
        console.log(`총 ${index - 1}개의 이미지를 로드했습니다.`);
      };

      img.src = imgPath;
    }

    loadNextImage();
  </script>

</body>
</html>
